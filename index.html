document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

adient(180deg,var(--card),var(--card-2));box-shadow:0 8px 24px rgba(0,0,0,.35);\">\n      <div class=\"om-count\" data-to=\"6\" style=\"font-family:'Bebas Neue',sans-serif;font-size:clamp(32px,4.6vw,46px);line-height:1;color:var(--gold-bright);\">6<\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:1.5px;color:var(--cream-dim);text-transform:uppercase;margin-top:8px;\">Jugadores simultáneos<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"text-align:center;border:1px solid rgba(212,175,55,.25);border-radius:14px;padding:22px 14px;background:linear-gradient(180deg,var(--card),var(--card-2));box-shadow:0 8px 24px rgba(0,0,0,.35);\">\n      <div class=\"om-count\" data-to=\"5\" style=\"font-family:'Bebas Neue',sans-serif;font-size:clamp(32px,4.6vw,46px);line-height:1;color:var(--gold-bright);\">5<\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:1.5px;color:var(--cream-dim);text-transform:uppercase;margin-top:8px;\">Etapas del proyecto<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"text-align:center;border:1px solid rgba(212,175,55,.25);border-radius:14px;padding:22px 14px;background:linear-gradient(180deg,var(--card),var(--card-2));box-shadow:0 8px 24px rgba(0,0,0,.35);\">\n      <div class=\"om-count\" data-to=\"205685\" data-prefix=\"$\" data-sep=\"1\" style=\"font-family:'Bebas Neue',sans-serif;font-size:clamp(26px,3.6vw,38px);line-height:1;color:var(--gold-bright);\">$205.685<\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:1.5px;color:var(--cream-dim);text-transform:uppercase;margin-top:8px;\">Presupuesto estimado<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"proyecto\" class=\"om-reveal\" style=\"max-width:1100px;margin:0 auto;padding:90px 24px;\">\n  <div style=\"display:inline-flex;align-items:center;gap:10px;margin-bottom:14px;\"><span style=\"width:26px;height:1px;background:var(--gold);\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:2px;color:var(--gold-bright);text-transform:uppercase;\">El proyecto<\u002Fspan><\u002Fdiv>\n  <h2 style=\"font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,4vw,42px);letter-spacing:1px;color:var(--gold-bright);margin:0 0 20px;\">¿Qué es?<\u002Fh2>\n  <p style=\"font-size:16.5px;line-height:1.7;color:var(--cream-dim);max-width:760px;margin:0 0 44px;\">Es una máquina que funciona con cartas de póker con tecnología RFID. El sistema mezcla el mazo de forma mecánica, lee la identidad de cada carta a través de sensores RFID y las reparte automáticamente a cada jugador, eliminando el mezclado manual y asegurando un reparto preciso y parejo.<\u002Fp>\n  <div style=\"overflow-x:auto;padding-bottom:8px;\">\n    <div style=\"display:grid;grid-template-columns:1fr 96px 1fr 96px 1fr;align-items:stretch;min-width:760px;\">\n      <div class=\"om-flownode\" style=\"background:linear-gradient(180deg,var(--red-pocket),var(--red-pocket-dark));border:1px solid rgba(212,175,55,.35);border-radius:14px;padding:24px;box-shadow:0 6px 18px rgba(0,0,0,.4);animation:flownode 6s infinite;animation-delay:0s;\">\n        <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#f3ead6\" stroke-width=\"1.6\"><path d=\"M4 7l8 3 8-3M4 12l8 3 8-3M4 17l8 3 8-3\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;color:#fff;margin:14px 0 6px;\">01 · MEZCLAR<\u002Fdiv>\n        <p style=\"font-size:14px;line-height:1.6;color:rgba(255,255,255,.85);margin:0;\">Un mecanismo mecánico agita y mezcla el mazo completo antes de cada mano.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"position:relative;display:flex;align-items:center;padding:0 10px;\">\n        <div class=\"om-flowdash\" style=\"position:relative;width:100%;height:2px;background:repeating-linear-gradient(90deg,rgba(212,175,55,.65) 0 8px,transparent 8px 16px);background-size:16px 2px;animation:flowdash 1.1s linear infinite;\">\n          <div class=\"om-flowchip\" style=\"position:absolute;top:-13px;left:0;width:18px;height:25px;background:#f8f6f0;border:1.5px solid #1a1a1a;border-radius:3px;box-shadow:0 3px 8px rgba(0,0,0,.55);opacity:0;animation:flowslide1 6s infinite;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position:absolute;right:3px;top:50%;margin-top:-5px;width:0;height:0;border-style:solid;border-width:5px 0 5px 7px;border-color:transparent transparent transparent var(--gold);\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"om-flownode\" style=\"background:linear-gradient(180deg,#232323,var(--black-pocket));border:1px solid rgba(212,175,55,.35);border-radius:14px;padding:24px;box-shadow:0 6px 18px rgba(0,0,0,.4);animation:flownode 6s infinite;animation-delay:2s;\">\n        <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#f3ead6\" stroke-width=\"1.6\"><path d=\"M12 4v3M7 8a7 7 0 0110 0M4.5 5.5a10.5 10.5 0 0115 0M12 15a2 2 0 100 4 2 2 0 000-4z\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;color:#fff;margin:14px 0 6px;\">02 · LEER<\u002Fdiv>\n        <p style=\"font-size:14px;line-height:1.6;color:rgba(255,255,255,.85);margin:0;\">Cada carta lleva un tag RFID que el lector identifica al pasar por el sistema.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"position:relative;display:flex;align-items:center;padding:0 10px;\">\n        <div class=\"om-flowdash\" style=\"position:relative;width:100%;height:2px;background:repeating-linear-gradient(90deg,rgba(212,175,55,.65) 0 8px,transparent 8px 16px);background-size:16px 2px;animation:flowdash 1.1s linear infinite;\">\n          <div class=\"om-flowchip\" style=\"position:absolute;top:-13px;left:0;width:18px;height:25px;background:#f8f6f0;border:1.5px solid #1a1a1a;border-radius:3px;box-shadow:0 3px 8px rgba(0,0,0,.55);opacity:0;animation:flowslide2 6s infinite;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position:absolute;right:3px;top:50%;margin-top:-5px;width:0;height:0;border-style:solid;border-width:5px 0 5px 7px;border-color:transparent transparent transparent var(--gold);\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"om-flownode\" style=\"background:linear-gradient(180deg,var(--red-pocket),var(--red-pocket-dark));border:1px solid rgba(212,175,55,.35);border-radius:14px;padding:24px;box-shadow:0 6px 18px rgba(0,0,0,.4);animation:flownode 6s infinite;animation-delay:4s;\">\n        <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#f3ead6\" stroke-width=\"1.6\"><rect x=\"3\" y=\"8\" width=\"8\" height=\"11\" rx=\"1\"><\u002Frect><rect x=\"13\" y=\"5\" width=\"8\" height=\"11\" rx=\"1\"><\u002Frect><\u002Fsvg>\n        <div style=\"font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;color:#fff;margin:14px 0 6px;\">03 · REPARTIR<\u002Fdiv>\n        <p style=\"font-size:14px;line-height:1.6;color:rgba(255,255,255,.85);margin:0;\">La máquina distribuye las cartas identificadas a cada jugador en orden.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"objetivos\" class=\"om-reveal\" style=\"max-width:1100px;margin:0 auto;padding:90px 24px;\">\n  <div style=\"display:inline-flex;align-items:center;gap:10px;margin-bottom:14px;\"><span style=\"width:26px;height:1px;background:var(--gold);\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:2px;color:var(--gold-bright);text-transform:uppercase;\">Objetivos<\u002Fspan><\u002Fdiv>\n  <h2 style=\"font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,4vw,42px);letter-spacing:1px;color:var(--gold-bright);margin:0 0 20px;\">Qué buscamos lograr<\u002Fh2>\n  <p style=\"font-size:16.5px;line-height:1.7;color:var(--cream-dim);max-width:760px;margin:0 0 44px;\">Automatizar el mezclado <\u002Fdiv>\n        \n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'Bebas Neue',sans-serif;font-size:17px;color:var(--cream);margin-bottom:8px;\">Mateo Nahuel Varela Velazquez<\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--cream-dim);\">mvarela@alumno.huergo.edu.ar<\u002Fdiv>\n        \n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"height:1px;background:linear-gradient(90deg,rgba(212,175,55,.35),transparent);margin-bottom:20px;\"><\u002Fdiv>\n    <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;color:var(--cream-dim);text-transform:uppercase;\"><\u002Fspan>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst SEED_TASKS = [\n  {\"name\":\"Planteamiento de Idea\",\"start\":\"2026-05-07\",\"end\":\"2026-05-28\",\"done\":true,\"notes\":\"En esta semana planteamos y analizamos como funcionaria el sistema del repartidor, y que materiales necesitariamos.\",\"images\":[]},\n  {\"name\":\"Creación de boceto 3D\",\"start\":\"2026-05-28\",\"end\":\"2026-06-18\",\"done\":true,\"notes\":\"Creamos un boceto 3D para empezar a ver prototipos del apartado de mezclador\",\"images\":[\"uploads/cronograma-img/etapa-1.jpg\"]},\n  {\"name\":\"Prueba de funcionamiento de Motores\",\"start\":\"2026-06-18\",\"end\":\"2026-07-16\",\"done\":true,\"notes\":\"Planteamos como utilizar la variación de velocidad de motores controlandolo de manera digital con PWM utilizando un MOSFET\",\"images\":[\"uploads/cronograma-img/etapa-2.jpg\"]},\n  {\"name\":\"Vacaciones de Invierno\",\"start\":\"2026-07-16\",\"end\":\"2026-07-30\",\"done\":true,\"notes\":\"\",\"images\":[]},\n  {\"name\":\"Ensamble de Impresión 3D\",\"start\":\"2026-08-06\",\"end\":\"2026-08-08\",\"done\":false,\"notes\":\"Realizamos los ensambles de la impresión 3D para probar su funcionamiento con los motores\",\"images\":[]}\n];\nconst MONTHS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];\n\nconst WHEEL_VARIANTS = ['wheelplayA','wheelplayB','wheelplayC'];\nconst BALL_VARIANTS = ['ballorbitA','ballorbitB','ballorbitC'];\nfunction pickOther(arr, exclude){\n  if(arr.length <= 1) return arr[0];\n  let c;\n  do { c = arr[Math.floor(Math.random() * arr.length)]; } while(c === exclude);\n  return c;\n}\n\nclass Component extends DCLogic {\n  state = { tasks: SEED_TASKS, variantIdx: 1, wheelVariant: 'wheelplayB', ballVariant: 'ballorbitB', spinDuration: 33, ballOffsetDeg: 140 };\n  componentDidMount(){\n    this._spinTimer = setTimeout(() => this.scheduleSpin(), this.state.spinDuration * 1000);\n    this.setupReveal();\n    this.setupCounters();\n    this.setupHeroTilt();\n  }\n  componentWillUnmount(){\n    clearTimeout(this._spinTimer);\n    if(this._io) this._io.disconnect();\n    if(this._ioc) this._ioc.disconnect();\n    if(this._onMove) window.removeEventListener('mousemove', this._onMove);\n  }\n  setupReveal(){\n    const els = document.querySelectorAll('.om-reveal');\n    if(!('IntersectionObserver' in window)){ els.forEach(e => e.classList.add('is-in')); return; }\n    this._io = new IntersectionObserver((entries) => {\n      entries.forEach(en => {\n        if(en.isIntersecting){ en.target.classList.add('is-in'); this._io.unobserve(en.target); }\n      });\n    }, { threshold: 0.08, rootMargin: '0px 0px -6% 0px' });\n    els.forEach(e => this._io.observe(e));\n  }\n  setupCounters(){\n    const els = document.querySelectorAll('.om-count');\n    if(!els.length) return;\n    const fmt = (n, sep) => sep ? n.toLocaleString('es-AR') : String(n);\n    const run = (el) => {\n      const to = parseFloat(el.dataset.to);\n      const prefix = el.dataset.prefix || '';\n      const sep = el.dataset.sep === '1';\n      const dur = 1500;\n      const t0 = performance.now();\n      const step = (t) => {\n        const p = Math.min((t - t0) / dur, 1);\n        const eased = 1 - Math.pow(1 - p, 3);\n        el.textContent = prefix + fmt(Math.round(to * eased), sep);\n        if(p < 1) requestAnimationFrame(step);\n      };\n      requestAnimationFrame(step);\n    };\n    if(!('IntersectionObserver' in window)) return;\n    this._ioc = new IntersectionObserver((entries) => {\n      entries.forEach(en => {\n        if(en.isIntersecting){ run(en.target); this._ioc.unobserve(en.target); }\n      });\n    }, { threshold: 0.4 });\n    els.forEach(e => this._ioc.observe(e));\n  }\n  setupHeroTilt(){\n    const el = document.querySelector('.om-hero-3d');\n    if(!el || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    this._onMove = (ev) => {\n      const r = el.getBoundingClientRect();\n      const dx = (ev.clientX - (r.left + r.width / 2)) / window.innerWidth;\n      const dy = (ev.clientY - (r.top + r.height / 2)) / window.innerHeight;\n      el.style.transform = 'perspective(700px) rotateY(' + (dx * 18).toFixed(2) + 'deg) rotateX(' + (-dy * 15).toFixed(2) + 'deg)';\n    };\n    window.addEventListener('mousemove', this._onMove, { passive: true });\n  }\n  scheduleSpin(){\n    const idx = pickOther([0,1,2], this.state.variantIdx);\n    const wheelVariant = WHEEL_VARIANTS[idx];\n    const ballVariant = BALL_VARIANTS[idx];\n    const spinDuration = 24 + Math.random() * 18;\n    const ballOffsetDeg = Math.floor(Math.random() * 360);\n    this.setState({ variantIdx: idx, wheelVariant, ballVariant, spinDuration, ballOffsetDeg });\n    this._spinTimer = setTimeout(() => this.scheduleSpin(), spinDuration * 1000);\n  }\n  fmt(d){\n    const dt = new Date(d + 'T00:00:00');\n    return dt.getDate() + ' ' + MONTHS[dt.getMonth()];\n  }\n  renderVals(){\n    const tasks = this.state.tasks || [];\n    const times = tasks.flatMap(t => [new Date(t.start+'T00:00:00').getTime(), new Date(t.end+'T00:00:00').getTime()]);\n    const min = Math.min.apply(null, times), max = Math.max.apply(null, times);\n    const span = Math.max(max - min, 1);\n    const rows = tasks.map((t, idx) => {\n      const s = new Date(t.start+'T00:00:00').getTime();\n      const e = new Date(t.end+'T00:00:00').getTime();\n      const left = ((s - min) / span) * 100;\n      const width = Math.max(((e - s) / span) * 100, 3);\n      const fill = t.done\n        ? 'linear-gradient(90deg,#1a7a4a,#0f5533)'\n        : (idx % 2 ? 'linear-gradient(90deg,#232323,var(--black-pocket))' : 'linear-gradient(90deg,var(--red-pocket),var(--red-pocket-dark))');\n      return {\n        name: t.name,\n        notes: t.notes,\n        hasNotes: !!t.notes,\n        image: (t.images && t.images[0]) || '',\n        hasImage: !!(t.images && t.images.length),\n        range: this.fmt(t.start) + ' — ' + this.fmt(t.end),\n        statusLabel: t.done ? 'HECHO' : 'EN CURSO',\n        statusStyle: \"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1px;padding:3px 9px;border-radius:999px;border:1px solid \" + (t.done ? 'rgba(26,122,74,.9)' : 'var(--gold)') + \";color:\" + (t.done ? '#7fd8a6' : 'var(--gold-bright)') + \";background:rgba(0,0,0,.25);white-space:nowrap;\",\n        barStyle: \"position:absolute;top:0;height:100%;border-radius:999px;left:\" + left + \"%;width:\" + width + \"%;background:\" + fill + \";border:1px solid \" + (t.done ? 'rgba(212,175,55,.45)' : 'var(--gold)') + \";box-shadow:0 3px 10px rgba(0,0,0,.45);\"\n      };\n    });\n    const dur = this.state.spinDuration;\n    return Object.assign({\n      rows: rows,\n      wheelAnimCss: this.state.wheelVariant + ' ' + dur + 's cubic-bezier(.42,0,.58,1) infinite',\n      ballAnimCss: this.state.ballVariant + ' ' + dur + 's cubic-bezier(.42,0,.58,1) infinite',\n      ballOffsetDeg: this.state.ballOffsetDeg\n    }, this.progress(tasks));\n  }\n  progress(tasks){\n    const total = tasks.length;\n    const done = tasks.filter(t => t.done).length;\n    const pct = total ? Math.round((done/total)*100) : 0;\n    return {\n      hasTasks: total > 0,\n      progressPct: pct,\n      progressBarStyle: \"height:100%;background:linear-gradient(90deg,var(--red-pocket),var(--gold));border-radius:999px;width:\" + pct + \"%;transition:width .5s;\",\n      progressLabel: total ? (done + ' de ' + total + ' etapas completadas') : 'Todavía no se cargaron etapas en el cronograma'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
